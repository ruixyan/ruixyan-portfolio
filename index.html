    <!-- Apply a saved light/dark choice before the page paints, so it never flashes the wrong theme -->
<script>
  try {
    var saved = localStorage.getItem("theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
